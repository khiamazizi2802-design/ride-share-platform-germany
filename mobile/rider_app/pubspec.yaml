name: gruenfahrt_rider
description: GrünFahrt Rider App - Nachhaltige Mobilität für alle
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Karten & Standort
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  permission_handler: ^11.1.0

  # Zustandsverwaltung
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Netzwerk
  dio: ^5.3.3

  # Firebase
  firebase_core: ^2.24.2
  firebase_messaging: ^14.7.10

  # Zahlung
  flutter_stripe: ^9.3.0

  # Sprache
  speech_to_text: ^6.3.0
  flutter_tts: ^3.8.5

  # Lokalisierung & Internationalisierung
  intl: ^0.18.1

  # JSON
  json_annotation: ^4.8.1

  # Utilities
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^2.7.0
  uuid: ^4.2.1
  logger: ^2.0.2+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
