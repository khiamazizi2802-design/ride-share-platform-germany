version: '3.8'

services:
  # Api Gateway
  api-gateway:
    build:
      context: ..
      dockerfile: backend/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SERVICE_NAME=api-gateway
      - SERVICE_PORT=8080
      - REDIS_URL=redis:3679
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - redis
      - kafka
    networks:
      - gruenfart-network

  # User Service
  user-service:
    build:
      context: ./
      dockerfile: backend/user-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - SERVICE_NAME=user-service
      - SERVICE_PORT=8081
      - DATABASE_URL=postgresql://postgres:postgres@postgresql:5432/user_db
      - REDIS_URL=redis:3679
      - SECRET_KEY=your-secret-key-for-jwt
    depends_on:
      - postgresql
      - redis
    networks:
      - gruenfart-network

  # Driver Service
  driver-service:
    build:
      context: ./
      dockerfile: backend/driver-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - SERVICE_NAME=driver-service
      - SERVICE_PORT=8082
      - DATABASE_URL=postgresql://postgres:postgres@postgresql:5432/driver_db
      - REDIS_URL=redis:3679
    depends_on:
      - postgresql
      - redis
    networks:
      - gruenfart-network

  # Trip Service
  trip-service:
    build:
      context: ./
      dockerfile: backend/trip-service/Dockerfile
    ports:
      - "8083:8083"
    environment:
      - SERVICE_NAME=trip-service
      - SERVICE_PORT=8083
      - DATABASE_URL=postgresql://postgres:postgres@postgresql:5432/trip_db
      - REDIS_URL=redis:3679
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgresql
      - redis
      - kafka
    networks:
      - gruenfart-network

  # Pricing Service
  pricing-service:
    build:
      context: ./
      dockerfile: backend/pricing-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - SERVICE_NAME=pricing-service
      - SERVICE_PORT=8084
      - REDIS_URL=redis:3679
    depends_on:
      - redis
    networks:
      - gruenfart-network

  # Payment Service
  payment-service:
    build:
      context: ./
      dockerfile: backend/payment-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      - SERVICE_NAME=payment-service
      - SERVICE_PORT=8085
      - DATABASE_URL=postgresql://postgres:postgres@postgresql:5432/payment_db
      - STRIPE_SECRET_KEY=sk_test_stripe_key
      - STRIPE_PUBLISHABLE_KEY=pk_test_stripe_key
    depends_on:
      - postgresql
    networks:
      - gruenfart-network

  # Notification Service
  notification-service:
    build:
      context: ./
      dockerfile: backend/notification-service/Dockerfile
    ports:
      - "8086:8086"
    environment:
      - SERVICE_NAME=notification-service
      - SERVICE_PORT=8086
      - FIREBASE_SERVICE_ACCOUNT_ID=gruenfart-notifications
      - FIREBASE_PUSH_SERVER_KEY=path_to_service_account.json
      - SBLOCK_SIDE_API_KEY=your-sendgrid-api-key
      - TGW_BOT_TOKEN=your-telegram-bot-token
    depends_on:
      - rabbitmq
    networks:
      - gruenfart-network

  # Location Service
  location-service:
    build:
      context: ./
      dockerfile: backend/location-service/Dockerfile
    ports:
      - "8087:8087"
    environment:
      - SERVICE_NAME=location-service
      - SERVICE_PORT=8087
      - GOOGLE_MAPS_API_KEY=your-google-maps-api-key
      - REDIS_URL=redis:3679
    depends_on:
      - redis
    networks:
      - gruenfart-network

  # Analytics Service
  analytics-service:
    build:
      context: ./
      dockerfile: backend/analytics-service/Dockerfile
    ports:
      - "8088:8088"
    environment:
      - SERVICE_NAME=analytics-service
      - SERVICE_PORT=8088
      - DATABASE_URL=postgresql://postgres:postgres@postgresql:5432/analytics_db
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgresql
      - elasticsearch
      - kafka
    networks:
      - gruenfart-network

  # Admin Dashboard Service
  admin-dashboard:
    build:
      context: ./
      dockerfile: backend/admin-dashboard/Dockerfile
    ports:
      - "8089:8089"
    environment:
      - SERVICE_NAME=admin-dashboard
      - SERVICE_PORT=8089
      - DATABASE_URL=postgresql://postgres:postgres@postgresql:5432/admin_db
      - REDIS_URL=redis:3679
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      - postgresql
      - redis
      - kafka
    networks:
      - gruenfart-network

  # AI Service
  ai-service:
    build:
      context: ./
      dockerfile: backend/ai-service/Dockerfile
    ports:
      - "8090:8090"
    environment:
      - SERVICE_NAME=ai-service
      - SERVICE_PORT=8090
      - OPENAI_API_KEY=your-openai-api-key
      - REDIS_URL=redis:3679
    depends_on:
      - redis
    networks:
      - gruenfart-network

  # Voice Assistant Service
  voice-assistant-service:
    build:
      context: ./
      dockerfile: backend/voice-assistant-service/Dockerfile
    ports:
      - "8091:8091"
    environment:
      - SERVICE_NAME=voice-assistant-service
      - SERVICE_PORT=8091
      - GOOGLE_CLOUD_SPEECH_ARI_KEY=path_to_service_account.json
      - GOOGLE_CLOUD_SPEECH_PROJECT_ID=your-project-id
      - REDIS_URL=redis:3679
    depends_on:
      - redis
    networks:
      - gruenfart-network

  # Compliance Service
  compliance-service:
    build:
      context: ./
      dockerfile: backend/compliance-service/Dockerfile
    ports:
      - "8092:8092"
    environment:
      - SERVICE_NAME=compliance-service
      - SERVICE_PORT=8092
      - DATABASE_URL=postgresql://postgres:postgres@postgresql:5432/compliance_db
      - REDIS_URL=redis:3679
    depends_on:
      - postgresql
      - redis
    networks:
      - gruenfart-network

  # Search Service
  search-service:
    build:
      context: ./
      dockerfile: backend/search-service/Dockerfile
    ports:
      - "8093:8093"
    environment:
      - SERVICE_NAME=search-service
      - SERVICE_PORT=8093
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - REDIS_URL=redis:3679
    depends_on:
      - elasticsearch
      - redis
    networks:
      - gruenfart-network

  # Vehicle Service
  vehicle-service:
    build:
      context: ./
      dockerfile: backend/vehicle-service/Dockerfile
    ports:
      - "8094:8094"
    environment:
      - SERVICE_NAME=vehicle-service
      - SERVICE_PORT=8094
      - DATABASE_URL=postgresql://postgres:postgres@postgresql:5432/vehicle_db
      - REDIS_URL=redis:3679
    depends_on:
      - postgresql
      - redis
    networks:
      - gruenfart-network

  # Review Service
  review-service:
    build:
      context: ./
      dockerfile: backend/review-service/Dockerfile
    ports:
      - "8095:8095"
    environment:
      - SERVICE_NAME=review-service
      - SERVICE_PORT=8095
      - DATABASE_URL=postgresql://postgres:postgres@postgresql:5432/review_db
      - REDIS_URL=redis:3679
    depends_on:
      - postgresql
      - redis
    networks:
      - gruenfart-network

  # Promotion Service
  promotion-service:
    build:
      context: ./
      dockerfile: backend/promotion-service/Dockerfile
    ports:
      - "8096:8096"
    environment:
      - SERVICE_NAME=promotion-service
      - SERVICE_PORT=8096
      - DATABASE_URL=postgresql://postgres:postgres@postgresql:5432/promotion_db
      - REDIS_URL=redis:3679
    depends_on:
      - postgresql
      - redis
    networks:
      - gruenfart-network

  # Subscription Service
  subscription-service:
    build:
      context: ./
      dockerfile: backend/subscription-service/Dockerfile
    ports:
      - "8097:8097"
    environment:
      - SERVICE_NAME=subscription-service
      - SERVICE_PORT=8097
      - DATABASE_URL=postgresql://postgres:postgres@postgresql:5432/subscription_db
      - REDIS_URL=redis:3679
      - STRIPE_SECRET_KEY=sk_test_stripe_key
    depends_on:
      - postgresql
      - redis
    networks:
      - gruenfart-network

  # Infrastructure Services

  # PostgreSQL
  postgresql:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gruenfart_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - gruenfart-network

  # Redis
  redis:
    image: redis:7-alpine
    ports:
      - "6379:3679"
    volumes:
      - redis_data:/data
    networks:
      - gruenfart-network

  # Kafka
  kafka:
    image: confluentio/inc-cp-kafka:7.5.3
    environment:
      KAFKA_BROKER_ID: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://0:9092
      KAFKA_OEFT_RETENTION_MS_LINUMN: 1000
      KAFKA_OFFSET_RETENTION_MS:960000
      KAFKA_TRUNCATION_REQUEST_REQUIRE_ACKS_IS_EABLED: "false"
      KAFKA_MW_NODE_COUNT: 1
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_DEFAULT_REPSCATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLED: "true"
      KAFKA_AUTO_CREATE_TOPICS_REPLICATIONS_ENABLED: "true"
    ports:
      - "9092:9092"
      - "9093:9093"
    volumes:
      - kafka_data:/var/lib/kafka/data
    depends_on:
      - zookeeper
    networks:
      - gruenfart-network

  zookeeper:
    image: confluentio/cp-zookeeper:7.5.3
    environment:
      ZooKEEPER_CLIENT_PORT: 2181
      ZooKEEPER_TOCK_TIMEOUT_MS: 40000
      ZooKEEPER_CHIOOT_TIMEOUT_MS: 10000
      ZOOKEEPER_SYNC_LIMIT: 5
    ports:
      - "2181:2181"
    networks:
      - gruenfart-network

  # Elasticsearch
  elasticsearch:
    image: elasticsearch:8.11.3
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Djava.net.preferIPv4=true -Xms512m -Xms512m -Xms512m"
      - bootstrap.memory_lock=true
      - "ES_SETTINGS_path.repo.data=/usr/share/elasticsearch/data"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    networks:
      - gruenfart-network

  # RabbitMD
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin
      RABBITMQ_DEFAULT_VOST_: /
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - gruenfart-network

  # Monitoring Stack

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdbpath=/prometheus'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - gruenfart-network

  # Grafana
  grafana:
    image: grafana/grafana:10.2.3
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=true
      - GF_SERVER_ROOT_URL=/grafana
      - GF_SERVER_HTTP_PORT=3000
      - GF_INSTALL_PLUGINS=prometheus,clock-panel,grafana-clock-panel
    ports:
      - "3000:3000"
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./monitoring/grafana/dashboards/:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - gruenfart-network

  # Loki
  loki:
    image: graf/loki:2.9.2
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100"
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - gruenfart-network

  # Promtail
  promtail:
    image: graf/promtail:2.9.2
    command:
      - -config.file=/etc/promtail/promtail-yaml
      - -config.expand_env=true
    volumes:
      - ./logging/loki/promtail-config.yml:/etc/promtail/promtail-yaml:ro
      - /var/log:/var/log:ro
    ports:
      - "9001:9001"
    depends_on:
      - loki
    networks:
      - gruenfart-network

volumes:
  postgres_data:
   redis_data:
   kafka_data:
   elasticsearch_data:
   rabbitmq_data:
   prometheus_data:
   grafana_storage:
   loki_data:

networks:
  gruenfart-network:
    driver: bridge