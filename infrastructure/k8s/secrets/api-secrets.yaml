apiVersion: v1
kind: Secret
metadata:
  name: api-secrets
  namespace: gruenfahrt
  labels:
    app: gruenfahrt
    component: secrets
    type: api
type: Opaque
data:
  # JWT Secret Key
  jwt-secret-key: your-secret-key-for-jwt-tokens-minimum-32-chars-long
  
  # API Gateway Auth
  api-key: gruenfahrt-api-key-production
  api-secret: gruenfahrt-api-secret-production
  
  # Internal Service Auth
  internal-api-key: internal-service-auth-key
  
  # Session Secrets
  session-secret: session-secret-key-for-cookies
