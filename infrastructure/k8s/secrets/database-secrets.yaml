apiVersion: v1
kind: Secret
metadata:
  name: database-secrets
  namespace: gruenfahrt
  labels:
    app: gruenfahrt
    component: secrets
    type: database
type: Opaque
data:
  database-user: postgres
  database-password: postgres
  database-host: postgresql
  redis-password: ''

---
apiVersion: v1
kind: Secret
metadata:
  name: postgresql-app-secrets
  namespace: gruenfahrt
type: Opaque
data:
  user-db-url: postgresql://postgres:postgres@postgresql:5432/user_db
  driver-db-url: postgresql://postgres:postgres@postgresql:5432/driver_db
  trip-db-url: postgresql://postgres:postgres@postgresql:5432/trip_db
  payment-db-url: postgresql://postgres:postgres@postgresql:5432/payment_db
  analytics-db-url: postgresql://postgres:postgres@postgresql:5432/analytics_db
  admin-db-url: postgresql://postgres:postgres@postgresql:5432/admin_db
  compliance-db-url: postgresql://postgres:postgres@postgresql:5432/compliance_db
  vehicle-db-url: postgresql://postgres:postgres@postgresql:5432/vehicle_db
  review-db-url: postgresql://postgres:postgres@postgresql:5432/review_db
  promotion-db-url: postgresql://postgres:postgres@postgresql:5432/promotion_db
  subscription-db-url: postgresql://postgres:postgres@postgresql:5432/subscription_db
