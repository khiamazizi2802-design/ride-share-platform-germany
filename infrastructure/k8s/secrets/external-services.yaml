apiVersion: v1
kind: Secret
metadata:
  name: external-services
  namespace: gruenfahrt
  labels:
    app: gruenfahrt
    component: secrets
    type: external
type: Opaque
data:
  # Stripe
  stripe-secret-key: sk_test_your_stripe_secret_key
  stripe-publishable-key: pk_test_your_stripe_publishable_key
  stripe-webhook-secret: whs_your_stripe_webhook_secret
  
  # Google Cloud Services
  google-maps-api-key: your-google-maps-api-key
  google-cloud-speech-ari-key: path_to_service_account.json
  google-cloud-speech-project-id: your-gcp-project-id
  
  # Firebase
  firebase-service-account-key: path_to_service_account.json
  firebase-database-url: https://gruenfahrt-default-rtdb.firebaseio.com
  
  # OpenAI
  openai-api-key: sk-your-openai-api-key
  
  # SendGrid
  sendgrid-api-key: SG.your-sendgrid-api-key
  
  # Telegram
  telegram-bot-token: your-telegram-bot-token
