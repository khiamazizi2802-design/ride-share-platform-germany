apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    name: monitoring
    environment: production
    app.kubernetes.io/managed-by: helm
  annotations:
    description: "GruenFahrt Monitoring and Observability Stack"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: monitoring-compute
  namespace: monitoring
spec:
  hard:
    requests.cpu: "5"
    requests.memory: 10Gi
    limits.cpu: "10"
    limits.memory: 20Gi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: monitoring-limits
  namespace: monitoring
spec:
  limits:
  - type: Container
    max:
      cpu: "2"
      memory: "4Gi"
    default:
      cpu: "100m"
      memory: "128Mi"
  - type: Pod
    max:
      cpu: "4"
      memory: "4Gi"
    default:
      cpu: "100m"
      memory: "128Mi"