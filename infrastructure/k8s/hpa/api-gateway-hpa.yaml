apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-gateway-hpa
  namespace: gruenfahrt
  labels:
    app: gruenfahrt
    service: api-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: "70"
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: "80"
  behavior:
    scaleDown:
      stabilizeátionWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-gateway-pdb
  namespace: gruenfahrt
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: gruenfahrt
      service: api-gateway