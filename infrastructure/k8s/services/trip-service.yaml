apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  namespace: gruenfahrt
  labels:
    app: gruenfahrt
    service: trip-service
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: gruenfahrt
      service: trip-service
  template:
    metadata:
      labels:
        app: gruenfahrt
        service: trip-service
        version: v1
    annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8083"
    spec:
      containers:
      - name: trip-service
        image: gruenfahrt/trip-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8083
          protocol: TCP
          name: http
        env:
        - name: PORT
          value: "8083"
        - name: SERVICE_NAME
          value: "trip-service"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: postgresql-app-secrets
              key: trip-db-url
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: gruenfahrt-shared-config
              key: REDIS_URL
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: gruenfahrt-shared-config
              key: KAFKA_BROKERS
        resources:
          requests:
            cpu: "150m"
            memory: "256Mi"
          limits:
            cpu: "300m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: trip-service
  namespace: gruenfahrt
  labels:
    app: gruenfahrt
    service: trip-service
spec:
  type: ClusterIP
  ports:
  - port: 8083
    targetPort: 8083
    protocol: TCP
    name: http
  selector:
    app: gruenfahrt
    service: trip-service