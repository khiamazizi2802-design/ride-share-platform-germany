apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: gruenfahrt
  labels:
    app: gruenfahrt
    service: api-gateway
    version: v1
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: gruenfahrt
      service: api-gateway
  template:
    metadata:
      labels:
        app: gruenfahrt
        service: api-gateway
        version: v1
    annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: gruenfahrt-service-account
      containers:
      - name: api-gateway
        image: gruenfahrt/api-gateway:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          protocol: TCP
          name: http
        env:
        - name: PORT
          value: "8080"
        - name: LOG_LEVEL
          value: "info"
        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: gruenfahrt-shared-config
              key: REDIS_URL
        - name: KAFKA_BROKERS
          valueFrom:
            configMapKeyRef:
              name: gruenfahrt-shared-config
              key: KAFKA_BROKERS
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: jwt-secret-key
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: gruenfahrt
  labels:
    app: gruenfahrt
    service: api-gateway
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: gruenfahrt
    service: api-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gruenfahrt-service-account
  namespace: gruenfahrt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gruenfahrt-api-gateway-role
rules:
- apiGroups: [""]
  resources: ["services", "pods", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gruenfahrt-api-gateway-role-binding
subjects:
- kind: ServiceAccount
  name: gruenfahrt-service-account
  namespace: gruenfahrt
roleRef:
  kind: ClusterRole
  name: gruenfahrt-api-gateway-role
  apiGroup: rbac.authorization.k8s.io