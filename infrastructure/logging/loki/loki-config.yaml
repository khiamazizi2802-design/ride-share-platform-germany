auth_enabled: false

chunk_store_config:
  max_look_back_period: 0

compactor:
  working_directory: /ltms/loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_delete_works: true
  retention_delete_delay: 2h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
ingester:
  chunk_block_size: 262144
  chunk_idle_period: 3m
  chunk_retention_period: 1h
  max_transfer_retries: 0
  lifecycler:
    ring:
      kvstore:
        store: inmemory
    chunk_store:
      driver: filesystem
      index_block_cache_lifecycle:
        enabled: true
      metadata_cache_lifecycle:
        enabled: true
      filesystem:
        dir: /ltms/loki/chunks

analytics:
  enabled: true
schema_config:
  configs:
    - from: 2020-10-24
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h
      chunks:
        prefix: chunks_
        period: 24h
        cache_config:
          enabled: true
          max_cache_age: 30h

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_sections_download: true
