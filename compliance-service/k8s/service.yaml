apiVersion: v1
kind: Service
metadata:
  name: compliance-audit-service
  namespace: default
  labels:
    app: compliance-audit-service
    version: v1
    component: compliance
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8080"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: compliance-audit-service
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  sessionAffinity: None
