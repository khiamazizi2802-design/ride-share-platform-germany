apiVersion: v1
kind: Service
metadata:
  name: vehicle-management-service
  namespace: rideshare
  labels:
    app: vehicle-management-service
    version: v1
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: ClusterIP
  ports:
    - port: 8083
      targetPort: http
      protocol: TCP
      name: http
    - port: 9093
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    app: vehicle-management-service
    version: v1
---
apiVersion: v1
kind: Service
metadata:
  name: vehicle-management-service-headless
  namespace: rideshare
  labels:
    app: vehicle-management-service
    version: v1
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 9093
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    app: vehicle-management-service
    version: v1
