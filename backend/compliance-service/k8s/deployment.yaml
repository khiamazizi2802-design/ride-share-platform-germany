apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-service
  namespace: default
  labels:
    app: compliance-service
    version: v1
    component: backend
  annotations:
    deployment.kubernetes.io/revision: "1"
    description: "Compliance Service - Handles regulatory compliance and audit logging"
spec:
  replicas: 3
  selector:
    matchLabels:
      app: compliance-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: compliance-service
        version: v1
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: compliance-service-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 60
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - compliance-service
              topologyKey: kubernetes.io/hostname
      containers:
      - name: compliance-service
        image: compliance-service:latest
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8018
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "1Gi"
        envFrom:
        - configMapRef:
            name: compliance-service-config
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: compliance-service-secrets
              key: postgres-username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: compliance-service-secrets
              key: postgres-password
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: compliance-service-secrets
              key: redis-password
        - name: KAFKA_SASL_USERNAME
          valueFrom:
            secretKeyRef:
              name: compliance-service-secrets
              key: kafka-sasl-username
        - name: KAFKA_SASL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: compliance-service-secrets
              key: kafka-sasl-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: compliance-service-secrets
              key: jwt-secret
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: compliance-service-secrets
              key: encryption-key
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        startupProbe:
          httpGet:
            path: /health/startup
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 12
          successThreshold: 1
        volumeMounts:
        - name: tmp-dir
          mountPath: /tmp
        - name: compliance-service-tls
          mountPath: /etc/tls
          readOnly: true
      volumes:
      - name: tmp-dir
        emptyDir: {}
      - name: compliance-service-tls
        secret:
          secretName: compliance-service-tls
          optional: true
      imagePullSecrets:
      - name: registry-credentials
