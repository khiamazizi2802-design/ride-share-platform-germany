apiVersion: apps/v1
kind: Deployment
metadata:
  name: driver-onboarding-service
  labels:
    app: driver-onboarding-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: driver-onboarding-service
  template:
    metadata:
      labels:
        app: driver-onboarding-service
    spec:
      containers:
        - name: driver-onboarding-service
          image: <IMAGE_PLACEHOLDER>
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: driver-onboarding-secrets
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: driver-onboarding-secrets
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: driver-onboarding-secrets
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: driver-onboarding-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: driver-onboarding-secrets
                  key: DB_PASSWORD
            - name: NOTIFICATION_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: driver-onboarding-config
                  key: NOTIFICATION_SERVICE_URL
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: driver-onboarding-config
                  key: USER_SERVICE_URL
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: driver-onboarding-service
  labels:
    app: driver-onboarding-service
spec:
  type: ClusterIP
  selector:
    app: driver-onboarding-service
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
