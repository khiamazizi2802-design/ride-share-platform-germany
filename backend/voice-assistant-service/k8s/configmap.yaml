apiVersion: v1
kind: ConfigMap
metadata:
  name: voice-assistant-service-config
  namespace: rideshare
  labels:
    app: voice-assistant-service
    version: "1.0.0"
    component: voice
data:
  APP_ENV: "production"
  APP_PORT: "8080"
  METRICS_PORT: "9090"
  LOG_LEVEL: "info"
  DB_HOST: "postgres-service.rideshare.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "voice_assistant"
  DB_SSL_MODE: "require"
  DB_MAX_OPEN_CONNS: "25"
  DB_MAX_IDLE_CONNS: "10"
  DB_CONN_MAX_LIFETIME: "300s"
  REDIS_HOST: "redis-service.rideshare.svc.cluster.local"
  REDIS_PORT: "6379"
  REDIS_DB: "3"
  REDIS_POOL_SIZE: "20"
  REDIS_MIN_IDLE_CONNS: "5"
  REDIS_SESSION_TTL: "3600"
  KAFKA_BROKERS: "kafka-service.rideshare.svc.cluster.local:9092"
  KAFKA_CONSUMER_GROUP: "voice-assistant-service"
  KAFKA_VOICE_COMMANDS_TOPIC: "voice-commands"
  KAFKA_VOICE_EVENTS_TOPIC: "voice-events"
  KAFKA_NLU_RESULTS_TOPIC: "nlu-results"
  KAFKA_AUTO_OFFSET_RESET: "earliest"
  KAFKA_SESSION_TIMEOUT: "30000"
  WS_READ_BUFFER_SIZE: "4096"
  WS_WRITE_BUFFER_SIZE: "4096"
  WS_MAX_MESSAGE_SIZE: "65536"
  WS_PING_INTERVAL: "30s"
  WS_PONG_WAIT: "60s"
  WS_WRITE_WAIT: "10s"
  SPEECH_TO_TEXT_PROVIDER: "google"
  SPEECH_TO_TEXT_LANGUAGE: "en-US"
  SPEECH_TO_TEXT_SAMPLE_RATE: "16000"
  NLU_PROVIDER: "dialogflow"
  NLU_CONFIDENCE_THRESHOLD: "0.75"
  NLU_MAX_ALTERNATIVES: "3"
  JWT_EXPIRY: "3600"
  JWT_ISSUER: "rideshare-voice-assistant"
  RATE_LIMIT_REQUESTS_PER_MINUTE: "100"
  RATE_LIMIT_BURST: "20"
  SESSION_MAX_DURATION: "1800"
  SESSION_IDLE_TIMEOUT: "300"
  AUDIO_SAMPLE_RATE: "16000"
  AUDIO_CHANNELS: "1"
  AUDIO_ENCODING: "LINEAR16"
  CORS_ALLOWED_ORIGINS: "https://rideshare.com,https://app.rideshare.com"
  CORS_MAX_AGE: "86400"
  HEALTH_CHECK_INTERVAL: "30s"
  SHUTDOWN_TIMEOUT: "30s"