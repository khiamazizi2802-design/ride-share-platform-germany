apiVersion: v1
kind: Service
metadata:
  name: voice-assistant-service
  namespace: rideshare
  labels:
    app: voice-assistant-service
    version: "1.0.0"
    component: voice
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
spec:
  selector:
    app: voice-assistant-service
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
    - name: websocket
      port: 8081
      targetPort: 8080
      protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 1800
---
apiVersion: v1
kind: Service
metadata:
  name: voice-assistant-service-headless
  namespace: rideshare
  labels:
    app: voice-assistant-service
    component: voice
spec:
  selector:
    app: voice-assistant-service
  clusterIP: None
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP