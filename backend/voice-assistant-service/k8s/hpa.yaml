apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: voice-assistant-service-hpa
  namespace: rideshare
  labels:
    app: voice-assistant-service
    component: voice
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: voice-assistant-service
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    - type: Pods
      pods:
        metric:
          name: voice_active_sessions_total
        target:
          type: AverageValue
          averageValue: "50"
    - type: Pods
      pods:
        metric:
          name: voice_websocket_connections_active
        target:
          type: AverageValue
          averageValue: "100"
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
        - type: Percent
          value: 20
          periodSeconds: 120
      selectPolicy: Min